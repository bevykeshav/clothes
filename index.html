<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>दिन के कपड़े</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f5f0;--ink:#2a2a8f;--ink-soft:#6b6bb5;--line:#3d3d73;--danger:#a3322f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15162b;--ink:#b9baff;--ink-soft:#8082c8;--line:#9fa0e6;--danger:#ff8f8b;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#15162b;--ink:#b9baff;--ink-soft:#8082c8;--line:#9fa0e6;--danger:#ff8f8b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Kalam","Noto Sans Devanagari",system-ui,sans-serif;font-size:18px;line-height:1.3}
main{max-width:520px;margin:0 auto;padding:14px 16px 40px}
.day{margin-bottom:22px}
.day h2{margin:0 0 8px;text-align:center;font-size:22px;font-weight:700}
.day h2 small{font-size:14px;font-weight:400;color:var(--ink-soft);margin-left:6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.slot{position:relative;aspect-ratio:3/5;border:2.5px solid var(--line);border-radius:5px 3px 6px 3px/3px 6px 3px 5px;overflow:hidden}
.slot.split{display:flex;flex-direction:column}
.photo{position:relative;flex:1;min-height:0}
.slot.split .photo{border-bottom:2px dashed var(--ink-soft)}
.slot .pick{all:unset;box-sizing:border-box;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;cursor:pointer;color:var(--ink);font-family:inherit;font-size:17px;font-weight:700}
.slot .pick:focus-visible{outline:3px solid var(--ink);outline-offset:-5px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.slot .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--paper);color:var(--danger);font-size:18px;line-height:1;cursor:pointer;z-index:2}
.x:focus-visible,.opt:focus-visible,.nc:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.needs{padding:6px 8px 8px}
.nt{font-size:15px;font-weight:700;margin-bottom:4px}
.nrow{display:flex;flex-wrap:wrap;gap:5px}
.nc{display:inline-flex;align-items:center;gap:4px;font-size:15px;line-height:1.2;padding:2px 8px;border:1.5px solid var(--ink-soft);border-radius:12px;cursor:pointer}
.nc input{margin:0;width:16px;height:16px;accent-color:var(--danger)}
.slot .chg{position:absolute;left:6px;top:6px;z-index:2;font:inherit;font-size:14px;line-height:1.2;padding:3px 9px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);cursor:pointer}
.chg:focus-visible,.lbbar button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:20;display:flex;flex-direction:column}
.lb[hidden]{display:none}
.lbbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;color:#fff;font-size:15px}
.lbbar button{font:inherit;font-size:17px;font-weight:700;color:#fff;background:transparent;border:2px solid #fff;border-radius:6px;padding:4px 14px;cursor:pointer}
.lbs{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.lbs.z{display:block}
.lbs img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
.lbs.z img{max-width:none;max-height:none;width:250%;cursor:zoom-out}
.msg{color:var(--danger);font-size:15px;text-align:center;min-height:1.2em}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:520px;background:var(--paper);border:2.5px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0 0 4px;text-align:center;font-size:19px}
.opt{font:inherit;font-size:19px;font-weight:700;padding:12px;border:2.5px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
.opt.cancel{font-weight:400;border-color:var(--ink-soft);color:var(--ink-soft)}
</style>
</head>
<body>
<main>
 <div class="msg" id="msg" role="status"></div>
 <div id="days"></div>
</main>

<div class="sheet" id="sheet" hidden>
 <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetT">
  <h3 id="sheetT">फोटो कैसे जोड़ें?</h3>
  <button class="opt" id="cam" type="button">कैमरा से फोटो खींचें</button>
  <button class="opt" id="gal" type="button">गैलरी से चुनें</button>
  <button class="opt cancel" id="cancel" type="button">रद्द करो</button>
 </div>
</div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="फोटो बड़ी करके देखें">
 <div class="lbbar"><span>फोटो पर दबाएँ, बड़ी/छोटी होगी</span><button id="lbx" type="button">बंद करें</button></div>
 <div class="lbs" id="lbs"><img id="lbimg" alt="बड़ी फोटो"></div>
</div>
<input id="camIn" type="file" accept="image/*" capture="environment" hidden>
<input id="galIn" type="file" accept="image/*" hidden>

<script>
(function(){
var KEY="kapde_din_wise_v1";
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var ITEMS=["शर्ट","पैंट","जूते"];
var store={},curKey=null,trigger=null;
try{store=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){store={};}
var $=function(id){return document.getElementById(id)};
function say(t){$("msg").textContent=t;}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(store));say("");return true;}
 catch(e){say("जगह भर गई, कुछ फोटो हटाइए।");return false;}
}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function shrink(file){
 return new Promise(function(res,rej){
  var fr=new FileReader();fr.onerror=rej;
  fr.onload=function(){
   var im=new Image();im.onerror=rej;
   im.onload=function(){
    var M=480,s=Math.min(1,M/Math.max(im.width,im.height));
    var c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL("image/jpeg",0.72));
   };
   im.src=fr.result;
  };
  fr.readAsDataURL(file);
 });
}

function openSheet(key,btn){
 curKey=key;trigger=btn;
 $("sheet").hidden=false;
 $("cam").focus();
}
function closeSheet(){
 $("sheet").hidden=true;
 if(trigger&&document.body.contains(trigger))trigger.focus();
}
$("cam").onclick=function(){$("sheet").hidden=true;$("camIn").click();};
$("gal").onclick=function(){$("sheet").hidden=true;$("galIn").click();};
$("cancel").onclick=closeSheet;
$("sheet").onclick=function(e){if(e.target===$("sheet"))closeSheet();};
var lbTrigger=null;
function openLb(src,btn){
 lbTrigger=btn;
 $("lbimg").src=src;
 $("lbs").classList.remove("z");
 $("lb").hidden=false;
 $("lbs").scrollTop=0;$("lbs").scrollLeft=0;
 $("lbx").focus();
}
function closeLb(){
 $("lb").hidden=true;
 if(lbTrigger&&document.body.contains(lbTrigger))lbTrigger.focus();
}
$("lbx").onclick=closeLb;
$("lbimg").onclick=function(){
 var s=$("lbs");
 s.classList.toggle("z");
 s.scrollTop=0;s.scrollLeft=0;
};
$("lbs").onclick=function(e){if(e.target===$("lbs"))closeLb();};
document.addEventListener("keydown",function(e){
 if(e.key!=="Escape")return;
 if(!$("lb").hidden)closeLb();
 else if(!$("sheet").hidden)closeSheet();
});

function onFile(e){
 var f=e.target.files&&e.target.files[0];
 var key=curKey;
 e.target.value="";
 if(!f||!key)return;
 shrink(f).then(function(src){
  var old=store[key];store[key]=src;
  if(!save()){if(old)store[key]=old;else delete store[key];}
  render();
 }).catch(function(){say("फोटो पढ़ नहीं पाए, दूसरी फोटो आज़माइए।");});
}
$("camIn").onchange=onFile;
$("galIn").onchange=onFile;

function needs(day){
 var key=day+":nahi";
 var list=Array.isArray(store[key])?store[key]:[];
 var wrap=el("div","needs");
 wrap.appendChild(el("div","nt","मेरे पास नहीं है:"));
 var row=el("div","nrow");
 ITEMS.forEach(function(n){
  var lb=el("label","nc");
  var cb=document.createElement("input");cb.type="checkbox";cb.checked=list.indexOf(n)>-1;
  cb.onchange=function(){
   var cur=Array.isArray(store[key])?store[key].slice():[];
   var i=cur.indexOf(n);
   if(cb.checked&&i<0)cur.push(n);
   if(!cb.checked&&i>-1)cur.splice(i,1);
   if(cur.length)store[key]=cur;else delete store[key];
   save();
  };
  lb.appendChild(cb);lb.appendChild(document.createTextNode(n));
  row.appendChild(lb);
 });
 wrap.appendChild(row);
 return wrap;
}

function slot(day,which,label,withNeeds){
 var key=day+":"+which;
 var box=el("div","slot"+(withNeeds?" split":""));
 var area=withNeeds?el("div","photo"):box;
 var b=el("button","pick");b.type="button";
 b.setAttribute("aria-label",day+" – "+label);
 b.onclick=function(){openSheet(key,b);};
 if(store[key]){
  var im=el("img");im.src=store[key];im.alt=day+" का कपड़ा";area.appendChild(im);
  b.setAttribute("aria-label",day+" – फोटो बड़ी करके देखें");
  b.onclick=function(){openLb(store[key],b);};
  area.appendChild(b);
  var ch=el("button","chg","बदलो");ch.type="button";
  ch.setAttribute("aria-label",day+" – फोटो बदलें");
  ch.onclick=function(e){e.stopPropagation();openSheet(key,ch);};
  area.appendChild(ch);
  var x=el("button","x","×");x.type="button";x.setAttribute("aria-label","फोटो हटाएँ");
  x.onclick=function(e){e.stopPropagation();delete store[key];save();render();};
  area.appendChild(x);
 }else{
  b.textContent="फोटो जोड़ें";
  area.appendChild(b);
 }
 if(withNeeds){box.appendChild(area);box.appendChild(needs(day));}
 return box;
}
function render(){
 var wrap=$("days");wrap.textContent="";
 var t=new Date().getDay();
 for(var i=0;i<7;i++){
  var d=DAYS[(t+i)%7];
  var sec=el("section","day");
  var h=el("h2",null,d);if(i===0)h.appendChild(el("small",null,"आज"));
  sec.appendChild(h);
  var p=el("div","pair");
  p.appendChild(slot(d,"a","पहले बॉक्स में फोटो जोड़ें",false));
  p.appendChild(slot(d,"b","दूसरे बॉक्स में फोटो जोड़ें",true));
  sec.appendChild(p);wrap.appendChild(sec);
 }
}
render();
})();
</script>
</body>
</html>
