<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>आज के कपड़े</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef1ea;--ink:#2a2a8f;--ink-soft:#6b6bb5;--box:#f8f9f5;--peg:#c79a5b;--line:#3d3d73;--ok:#1f6b45;--danger:#a3322f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15162b;--ink:#b9baff;--ink-soft:#8082c8;--box:#1d1e3a;--peg:#b88a4c;--line:#9fa0e6;--ok:#7fd4a2;--danger:#ff8f8b;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#15162b;--ink:#b9baff;--ink-soft:#8082c8;--box:#1d1e3a;--peg:#b88a4c;--line:#9fa0e6;--ok:#7fd4a2;--danger:#ff8f8b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Kalam","Noto Sans Devanagari",system-ui,sans-serif;font-size:18px;line-height:1.35;min-height:100vh}
.rope{width:100%;height:70px;display:block}
.rope path{stroke:var(--line);fill:none;stroke-width:2}
.rope .peg{fill:var(--peg);stroke:var(--line);stroke-width:1.5}
main{max-width:1000px;margin:0 auto;padding:0 16px 40px;display:grid;grid-template-columns:1fr minmax(160px,200px) 1fr;gap:22px;align-items:start}
.hang{font-size:15px;color:var(--ink-soft);text-align:center;margin:0 0 6px}
.frame{border:2.5px solid var(--line);border-radius:6px 3px 7px 4px/4px 7px 3px 6px;background:var(--box);padding:12px;min-height:420px}
.frame h2{font-size:19px;margin:0 0 4px;font-weight:700}
.note{font-size:15px;color:var(--ink-soft);margin:0 0 10px}
.date{text-align:center;margin-top:34px}
.date .d,.date .w{border:2.5px solid var(--line);background:var(--box);padding:6px 8px}
.date .d{font-size:34px;font-weight:700;border-radius:4px 2px 0 0}
.date .w{font-size:22px;border-top:0;border-radius:0 0 3px 5px}
.date .hi{font-size:17px;margin-top:8px}
.date .t{font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.today-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.piece{border:2px solid var(--line);border-radius:4px;overflow:hidden;background:var(--paper)}
.piece img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.piece .cap{padding:2px 8px;font-size:15px;text-align:center}
.empty{color:var(--ink-soft);padding:30px 8px;text-align:center}
.tomorrow{margin-top:14px;padding-top:10px;border-top:2px dashed var(--ink-soft);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;color:var(--ink-soft)}
.tomorrow img{width:44px;height:58px;object-fit:cover;border:2px solid var(--line);border-radius:3px}
.add{display:inline-block;margin:0 0 12px;padding:8px 16px;font:inherit;font-weight:700;color:var(--ink);background:transparent;border:2.5px solid var(--line);border-radius:5px 3px 6px 3px/3px 6px 3px 5px;cursor:pointer}
.add:hover{background:var(--paper)}
.add:focus-visible,.chip:focus-visible,.x:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wardrobe{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.card{border:2px solid var(--line);border-radius:4px;background:var(--paper);padding:5px;position:relative}
.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:2px}
.card input.nm{width:100%;font:inherit;font-size:15px;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--ink-soft);margin-top:4px;padding:1px 2px}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.chip{font:inherit;font-size:13px;line-height:1.1;padding:2px 5px;border:1.5px solid var(--ink-soft);border-radius:10px;background:transparent;color:var(--ink-soft);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--box);color:var(--danger);font-size:16px;line-height:1;cursor:pointer}
.msg{color:var(--danger);font-size:15px;min-height:1.2em}
@media (max-width:760px){
 main{grid-template-columns:1fr;gap:16px}
 .date{order:-1;margin-top:0;display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:center}
 .date .d{grid-column:1}.date .w{grid-column:1}
 .date .side{grid-column:2;grid-row:1/3}
 .date .hi{margin-top:0}
 .frame{min-height:0}
}
</style>
</head>
<body>
<svg class="rope" viewBox="0 0 1000 70" preserveAspectRatio="none" aria-hidden="true">
 <path d="M0 14 Q250 40 500 26 T1000 14"/>
 <g class="peg"><rect x="140" y="26" width="14" height="30" rx="2"/><rect x="380" y="30" width="14" height="30" rx="2"/><rect x="620" y="30" width="14" height="30" rx="2"/><rect x="860" y="22" width="14" height="30" rx="2"/></g>
</svg>
<main>
 <section class="frame" aria-labelledby="h-today">
  <h2 id="h-today">आज पहनने के कपड़े</h2>
  <p class="note" id="mode"></p>
  <div id="today"></div>
  <div class="tomorrow" id="tomorrow"></div>
 </section>

 <div class="date" aria-live="off">
  <div class="d" id="dd">25-Nov</div>
  <div class="w" id="dw">Wednesday</div>
  <div class="side"><div class="hi" id="dh">बुधवार</div><div class="t" id="tm">00:00</div></div>
 </div>

 <section class="frame" aria-labelledby="h-mine">
  <h2 id="h-mine">मेरे कपड़े</h2>
  <p class="note">फोटो डालें। हर कपड़े पर वार चुन सकते हैं, तब वह उसी वार को दिखेगा। वार न चुनें तो कपड़े रोज़ तारीख़ से बदलते रहेंगे।</p>
  <button class="add" id="addbtn" type="button">कपड़े की फोटो जोड़ें</button>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <div class="msg" id="msg" role="status"></div>
  <div class="wardrobe" id="wardrobe"></div>
 </section>
</main>

<script>
(function(){
var KEY="aaj_ke_kapde_v1";
var EN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var HI=["रविवार","सोमवार","मंगलवार","बुधवार","गुरुवार","शुक्रवार","शनिवार"];
var SH=["रवि","सोम","मंगल","बुध","गुरु","शुक्र","शनि"];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var items=[];
try{var raw=localStorage.getItem(KEY);if(raw)items=JSON.parse(raw)||[];}catch(e){items=[];}
var $=function(id){return document.getElementById(id)};

function save(){
 try{localStorage.setItem(KEY,JSON.stringify(items));$("msg").textContent="";return true;}
 catch(e){$("msg").textContent="जगह भर गई, कुछ पुरानी फोटो हटाइए।";return false;}
}
function dayNum(d){return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
function pick(d){
 var wd=d.getDay();
 var set=items.filter(function(i){return i.days.indexOf(wd)>-1;});
 if(set.length)return {list:set,mode:"day"};
 if(!items.length)return {list:[],mode:"none"};
 var pool=items.filter(function(i){return !i.days.length;});
 var src=pool.length?pool:items;
 return {list:[src[dayNum(d)%src.length]],mode:"rot"};
}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function pieceNode(it){
 var p=el("div","piece");var im=el("img");im.src=it.src;im.alt=it.name||"कपड़ा";p.appendChild(im);
 if(it.name)p.appendChild(el("div","cap",it.name));return p;
}
function renderToday(){
 var now=new Date();var r=pick(now);var box=$("today");box.textContent="";
 if(!r.list.length){
  box.appendChild(el("div","empty","अभी कोई कपड़ा नहीं है। दाईं तरफ से फोटो जोड़ें।"));
  $("mode").textContent="";
 }else{
  var g=el("div","today-grid");r.list.forEach(function(i){g.appendChild(pieceNode(i));});box.appendChild(g);
  $("mode").textContent=r.mode==="day"?HI[now.getDay()]+" के लिए चुने हुए कपड़े":"आज की तारीख़ से अपने-आप चुना गया";
 }
 var tm=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
 var t=pick(tm);var tb=$("tomorrow");tb.textContent="";
 if(t.list.length){
  tb.appendChild(el("span",null,"कल ("+HI[tm.getDay()]+"):"));
  t.list.forEach(function(i){var im=el("img");im.src=i.src;im.alt=i.name||"कल का कपड़ा";tb.appendChild(im);});
 }
}
function renderDate(){
 var n=new Date();
 $("dd").textContent=(n.getDate()<10?"0":"")+n.getDate()+"-"+MON[n.getMonth()];
 $("dw").textContent=EN[n.getDay()];
 $("dh").textContent=HI[n.getDay()];
 $("tm").textContent=n.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true});
}
function renderWardrobe(){
 var w=$("wardrobe");w.textContent="";
 if(!items.length){w.appendChild(el("div","empty","यहाँ आपके कपड़े दिखेंगे।"));return;}
 items.forEach(function(it){
  var c=el("div","card");var im=el("img");im.src=it.src;im.alt=it.name||"कपड़ा";c.appendChild(im);
  var x=el("button","x","×");x.type="button";x.setAttribute("aria-label","कपड़ा हटाएँ");
  x.onclick=function(){items=items.filter(function(o){return o.id!==it.id;});save();renderAll();};
  c.appendChild(x);
  var nm=el("input","nm");nm.placeholder="नाम (जैसे नीली शर्ट)";nm.value=it.name||"";nm.setAttribute("aria-label","कपड़े का नाम");
  nm.onchange=function(){it.name=nm.value.trim();save();renderToday();};
  c.appendChild(nm);
  var ch=el("div","chips");
  SH.forEach(function(s,d){
   var b=el("button","chip"+(it.days.indexOf(d)>-1?" on":""),s);b.type="button";
   b.setAttribute("aria-pressed",it.days.indexOf(d)>-1);
   b.onclick=function(){
    var k=it.days.indexOf(d);if(k>-1)it.days.splice(k,1);else it.days.push(d);
    save();renderAll();
   };
   ch.appendChild(b);
  });
  c.appendChild(ch);w.appendChild(c);
 });
}
function renderAll(){renderToday();renderWardrobe();}

function shrink(file){
 return new Promise(function(res,rej){
  var fr=new FileReader();
  fr.onerror=rej;
  fr.onload=function(){
   var im=new Image();im.onerror=rej;
   im.onload=function(){
    var M=480,s=Math.min(1,M/Math.max(im.width,im.height));
    var c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL("image/jpeg",0.72));
   };
   im.src=fr.result;
  };
  fr.readAsDataURL(file);
 });
}
$("addbtn").onclick=function(){$("file").click();};
$("file").onchange=function(e){
 var files=Array.prototype.slice.call(e.target.files||[]);
 Promise.all(files.map(shrink)).then(function(arr){
  arr.forEach(function(src){items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),src:src,name:"",days:[]});});
  if(!save()){items.splice(items.length-arr.length,arr.length);}
  renderAll();
 }).catch(function(){$("msg").textContent="फोटो पढ़ नहीं पाए, दूसरी फोटो आज़माइए।";});
 e.target.value="";
};

var lastKey="";
function tick(){
 var n=new Date();renderDate();
 var k=n.getFullYear()+"-"+n.getMonth()+"-"+n.getDate();
 if(k!==lastKey){lastKey=k;renderToday();}
}
renderWardrobe();tick();setInterval(tick,1000);
})();
</script>
</body>
</html>
